[package]
name = "iroh-ping"
version = "1.0.0"
edition = "2024"
description = "high level PING-PONG iroh protocol"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/n0-computer/iroh-ping"
keywords = ["iroh", "protocol"]
rust-version = "1.91"

[dependencies]
anyhow = "1.0"
iroh = { version = "1.0.0", default-features = false }
iroh-metrics = "1.0.1"
n0-error = "1.0.0"

[dev-dependencies]
iroh-gossip = "0.101"
futures-lite = "2"
iroh-services = { path = "../iroh-services/iroh-services" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
iroh-tickets = "1.0.0"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
